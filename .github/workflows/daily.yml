name: Daily desk brief refresh

on:
  schedule:
    # 07:00 Hong Kong time = 23:00 UTC previous day
    - cron: "0 23 * * *"
  workflow_dispatch:   # allows a manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch feeds and synthesise take
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 fetch_news.py

      - name: Commit refreshed data
        run: |
          git config user.name "deskbrief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json data/fallback.js
          git diff --cached --quiet || git commit -m "chore: daily refresh $(date -u +%F)"
          git push
