<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk Brief — Energy &amp; Shipping Daily</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#12161b; --panel2:#171c22; --line:#232a32;
    --txt:#e8edf2; --dim:#8b96a3; --accent:#f0b429; --accent2:#3fa9f5;
    --ok:#34c98e; --bad:#e05d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:14px;line-height:1.55;padding:24px clamp(16px,4vw,56px) 64px;}
  a{color:inherit;text-decoration:none}
  a:hover .t{color:var(--accent2)}

  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  header h1{font-size:22px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  header h1 span{color:var(--accent)}
  header .meta{margin-left:auto;color:var(--dim);font-size:12px;text-align:right}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

  .take{background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:8px;padding:22px 26px;margin-bottom:32px}
  .take h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px}
  .take p{font-size:16px;line-height:1.7;color:var(--txt)}
  .take .tag{color:var(--dim);font-size:11px;margin-top:12px}

  .grid{display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:16px 18px;display:flex;flex-direction:column}
  .card h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h3 .src-url{margin-left:auto;font-size:10px;color:var(--dim);
    text-transform:none;letter-spacing:0;font-weight:400}
  .item{padding:8px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none}
  .item .t{font-weight:600;font-size:13.5px}
  .item .d{color:var(--dim);font-size:11px;margin-top:2px}
  .item .s{color:var(--dim);font-size:12px;margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .err{color:var(--bad);font-size:12px}
  footer{margin-top:40px;color:var(--dim);font-size:11px;text-align:center;
    border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>

<header>
  <h1>Desk<span>Brief</span> — Energy &amp; Shipping</h1>
  <div class="meta" id="meta">loading…</div>
</header>

<section class="take" id="take">
  <h2>Daily Headline Take</h2>
  <p id="take-text">Synthesising…</p>
  <div class="tag" id="take-tag"></div>
</section>

<div class="grid" id="grid"></div>

<footer>
  Feeds: EIA Today in Energy · Oilprice · Splash247 · Ship &amp; Bunker · FT Alphaville · FRED Blog
  — synthesis via DeepSeek, British spelling conventions. Refresh: <code>python3 fetch_news.py</code>
</footer>

<script src="data/fallback.js"></script>
<script>
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => {try{return new URL(u).hostname}catch(e){return ""}};
const fmtDate = s => {const d=new Date(s);return isNaN(d)?s:d.toUTCString().slice(5,22)+" GMT"};

async function load(){
  let data;
  try{
    const r = await fetch("data/latest.json?ts="+Date.now());
    if(!r.ok) throw new Error(r.status);
    data = await r.json();
  }catch(e){
    if(window.__FALLBACK__){data=window.__FALLBACK__}
    else{document.getElementById("take-text").textContent="Could not load data/latest.json — run fetch_news.py first.";return;}
  }

  document.getElementById("meta").innerHTML =
    "Generated "+fmtDate(data.generated_at_utc)+
    " &nbsp;·&nbsp; "+data.feeds.filter(f=>f.ok).length+"/"+data.feeds.length+" feeds live";

  document.getElementById("take-text").textContent = data.take;
  document.getElementById("take-tag").textContent =
    "Synthesised from "+data.feeds.reduce((n,f)=>n+(f.count||0),0)+" headlines · DeepSeek · en-GB";

  const grid=document.getElementById("grid");
  grid.innerHTML = data.feeds.map(f=>{
    const dot = `<span class="dot" style="background:${f.ok?"var(--ok)":"var(--bad)"}"></span>`;
    const items = f.ok
      ? f.items.map(it=>`
        <div class="item">
          <a href="${esc(it.link)}" target="_blank" rel="noopener"><div class="t">${esc(it.title)}</div></a>
          <div class="d">${esc(fmtDate(it.published))}</div>
          ${it.summary?`<div class="s">${esc(it.summary)}</div>`:""}
        </div>`).join("")
      : `<div class="err">Feed unavailable: ${esc(f.error||"no items parsed")}</div>`;
    return `<div class="card">
      <h3>${dot}${esc(f.source)}<span class="src-url">${esc(host(f.url))}</span></h3>
      ${items}</div>`;
  }).join("");
}
load();
</script>
</body>
</html>
